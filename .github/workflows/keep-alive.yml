name: keep-alive

# Keeps the Render free-tier web service awake. Render sleeps a service after
# 15 min of no inbound traffic; this pings /health well under that window.
#
# Setup (one time): add a repo secret SERVICE_URL (no trailing slash) under
# Settings > Secrets and variables > Actions, e.g. https://naya-nava-vyapaar.onrender.com
# A missing secret fails the run with a clear message.

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Scheduled runs are best-effort and may
    # slip a few minutes under load; 5 min leaves margin under the 15-min sleep.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # optional manual trigger

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health (cold-start tolerant)
        env:
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
        run: |
          set -u
          if [ -z "${SERVICE_URL}" ]; then
            echo "::error::SERVICE_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          url="${SERVICE_URL%/}/health"
          sleep $(( RANDOM % 20 ))   # small jitter
          # Tolerate a cold start: connect timeout 15s, total 70s, retry twice
          # through the ~30-60s wake window. A sleeping service still receives the
          # request and starts waking; the next run confirms it.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 70 \
            --retry 2 --retry-delay 30 --retry-connrefused \
            "$url" || echo "000")

          case "$code" in
            2*) echo "OK   -> $code   ($url)" ;;
            *)  echo "::warning::WAKE -> $code (was likely asleep; cold start triggered)   ($url)" ;;
          esac
          echo "Keep-alive cycle complete."
